[project]
name = "churnlab"
version = "0.1.0"
description = "Telco Customer Churn – ESILV MLOps course project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2",
    "scikit-learn>=1.5,<1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnlab"]
